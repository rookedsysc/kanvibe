[package]
name = "kanvibe-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native-ui = ["dep:gpui", "dep:gpui-component", "dep:gpui-component-assets"]

[dependencies]
kanvibe-core.workspace = true
kanvibe-i18n.workspace = true
kanvibe-theme.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", optional = true, default-features = false, features = ["font-kit"] }
gpui-component = { version = "=0.5.1", optional = true }
gpui-component-assets = { version = "=0.5.1", optional = true }

[lints]
workspace = true

name: kanvibe_mobile
description: KanVibe 데스크탑에 연결해 보드와 터미널 pane을 보는 모바일 클라이언트.
publish_to: 'none'
version: 1.5.2+3

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.2.4
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  crypto: ^3.0.0
  web_socket_channel: ^3.0.3
  xterm: ^4.0.0
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.2
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  file_picker: 13.3.3
  flutter_highlight: ^0.7.0
  webview_flutter: ^4.14.1
  highlight: ^0.7.0
  markdown: ^7.3.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/kanvibe-logo.png
    - assets/fonts/NerdFontsSymbolsOnly-LICENSE.txt
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: SymbolsNerdFontMono
      fonts:
        - asset: assets/fonts/SymbolsNerdFontMono-Regular.ttf

# 연결 끊기는 연결 화면으로 돌아가는 것으로 끝나지 않는다. 데스크탑에 알리지 못했을 때만 뜨는 안내가 없어야
# 데스크탑의 기기 목록에서도 지워진 것이다.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "10[\\s\\S]*19736"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "127[\\s\\S]*19736"
- extendedWaitUntil:
    visible: "연결된 PC"
    timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "10.0.2.2 삭제"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "127.0.0.1 삭제"
- tapOn: "삭제"
- extendedWaitUntil:
    visible: "데스크탑에 연결"
    timeout: 10000
- assertNotVisible: "PC에 알리지 못했습니다. PC의 KanVibe 설정에서도 이 기기를 삭제해 주세요."
- takeScreenshot: 05-연결-끊은-뒤-연결-화면

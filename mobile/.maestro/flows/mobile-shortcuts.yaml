appId: ${APP_ID}
env:
  SHORTCUT_DESKTOP_PORT: "39786"
  DESKTOP_API_FROM_HOST: http://127.0.0.1:39786
---
- launchApp:
    clearState: true
- runScript:
    file: ../scripts/issue-dev-pairing-code.js
- tapOn: "데스크탑 주소"
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "10.0.2.2"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "127.0.0.1"
- tapOn: "포트"
- eraseText
- inputText: ${SHORTCUT_DESKTOP_PORT}
- tapOn: "연결 코드"
- eraseText
- inputText: ${output.pairingCode}
- hideKeyboard
- tapOn: "연결"
- extendedWaitUntil:
    visible: "(?s).*Mobile shortcut terminal.*"
    timeout: 40000
- tapOn: "(?s).*Mobile shortcut terminal.*"
- extendedWaitUntil:
    visible:
      id: pane-terminal
    timeout: 20000
- tapOn:
    id: pane-terminal
- assertVisible:
    id: shortcut-collapse
- takeScreenshot: shortcut-above-keyboard
- inputText: "printf SHORTCUT_QA_OK"
- pressKey: Enter
- tapOn:
    id: shortcut-collapse
- assertVisible:
    id: shortcut-expand
- assertNotVisible:
    id: shortcut-settings
- takeScreenshot: shortcut-collapsed
- tapOn:
    id: shortcut-expand
- tapOn:
    id: shortcut-settings
- assertVisible: "tmux 단축키"
- assertVisible: "단축키 바 표시"
- takeScreenshot: shortcut-settings
- tapOn: "단축키 바 표시"
- tapOn: "적용"
- assertVisible: "tmux · 단축키 꺼짐"
- tapOn:
    id: shortcut-settings
- tapOn: "기본값 복원"
- tapOn: "적용"
- assertVisible: "콤보 추가"
- takeScreenshot: shortcut-restored
- tapOn:
    id: shortcut-panel
- assertVisible: "좌우 분할"
- assertVisible:
    id: panel-key-split-right
- takeScreenshot: shortcut-session-panel
- tapOn: "키"
- assertVisible:
    id: panel-key-escape
- tapOn: "내 콤보"
- assertVisible: "아직 콤보가 없습니다.*"
- tapOn:
    id: shortcut-panel
- tapOn:
    id: shortcut-settings
- assertVisible: "키보드 미리보기"
- takeScreenshot: shortcut-keyboard-preview
- tapOn: "콤보 추가 .*"
- tapOn:
    id: combo-name
- inputText: "Copy"
- tapOn:
    id: combo-key-input
- inputText: "c"
- hideKeyboard
- tapOn: "Ctrl"
- tapOn: "Shift"
- assertVisible: 'Ctrl\+Shift\+c'
- takeScreenshot: shortcut-combo-chord
- tapOn: "콤보 저장"
- tapOn: "적용"
- assertVisible: "Copy"
- tapOn: "Copy"
- tapOn:
    id: shortcut-panel
- tapOn: "내 콤보"
- assertVisible:
    id: panel-key-combo-.*
- takeScreenshot: shortcut-saved-combo

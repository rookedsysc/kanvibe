appId: ${APP_ID}
env:
  PRIMARY_PORT: "19738"
  SECOND_PORT: "19739"
  PRIMARY_TASK_TITLE: "Chat History Fixture"
  SECOND_TASK_TITLE: "Chat History Fixture - Second"
  PRIMARY_HISTORY_PREFIX: "History QA"
  SECOND_HISTORY_PREFIX: "History QA Second"
  SECOND_DESKTOP_API_FROM_HOST: "http://127.0.0.1:19739"
---
# chat-history.yaml의 마지막 메시지 화면에서 시작하며 저장된 첫 PC 연결을 유지한다.
- assertVisible: "${PRIMARY_HISTORY_PREFIX} message 59"
- runFlow:
    when:
      visible:
        id: android:id/input_method_nav_back
    commands:
      - tapOn:
          id: android:id/input_method_nav_back
- tapOn: "(Back|뒤로)"
- extendedWaitUntil:
    visible: "채팅 History"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: android:id/input_method_nav_back
    commands:
      - tapOn:
          id: android:id/input_method_nav_back
- tapOn: "(Back|뒤로)"
- extendedWaitUntil:
    visible:
      id: chat-history
    timeout: 10000
- runFlow:
    when:
      visible:
        id: android:id/input_method_nav_back
    commands:
      - tapOn:
          id: android:id/input_method_nav_back
- tapOn: "(Back|뒤로)"
- extendedWaitUntil:
    visible: "(?s).*${PRIMARY_TASK_TITLE}.*"
    timeout: 10000
- tapOn: "(?s).*${PRIMARY_PORT}.*"
- assertVisible: "연결된 PC"
- tapOn: "PC 추가"
- runScript:
    file: ../scripts/issue-dev-pairing-code.js
    env:
      DESKTOP_API_FROM_HOST: ${SECOND_DESKTOP_API_FROM_HOST}
- tapOn: "PC 이름 (선택)"
- inputText: "History Second"
- tapOn: "데스크탑 주소"
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "10.0.2.2"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "127.0.0.1"
- tapOn: "포트"
- eraseText: 5
- inputText: ${SECOND_PORT}
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: "연결 코드"
          direction: DOWN
- tapOn: "연결 코드"
- inputText: ${output.pairingCode}
- scrollUntilVisible:
    element: "연결"
    direction: DOWN
- tapOn: "연결"
- extendedWaitUntil:
    visible: "(?s).*${SECOND_TASK_TITLE}.*"
    timeout: 40000
- assertNotVisible: "(?s)${PRIMARY_TASK_TITLE}(?:\n.*)?"
- takeScreenshot: history-second-pc-board
- tapOn: "(?s).*${SECOND_TASK_TITLE}.*"
- tapOn:
    id: chat-history
- extendedWaitUntil:
    visible: "(?s).*${SECOND_HISTORY_PREFIX} session 24.*"
    timeout: 30000
- assertNotVisible: "(?s).*${PRIMARY_HISTORY_PREFIX} session 24.*"
- tapOn: "(?s).*${SECOND_HISTORY_PREFIX} session 24.*"
- extendedWaitUntil:
    visible: "${SECOND_HISTORY_PREFIX} message 59"
    timeout: 30000
- assertNotVisible: "${PRIMARY_HISTORY_PREFIX} message 59"
- takeScreenshot: history-second-pc-messages
- runFlow:
    when:
      visible:
        id: android:id/input_method_nav_back
    commands:
      - tapOn:
          id: android:id/input_method_nav_back
- tapOn: "(Back|뒤로)"
- extendedWaitUntil:
    visible: "채팅 History"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: android:id/input_method_nav_back
    commands:
      - tapOn:
          id: android:id/input_method_nav_back
- tapOn: "(Back|뒤로)"
- extendedWaitUntil:
    visible:
      id: chat-history
    timeout: 10000
- runFlow:
    when:
      visible:
        id: android:id/input_method_nav_back
    commands:
      - tapOn:
          id: android:id/input_method_nav_back
- tapOn: "(Back|뒤로)"
- extendedWaitUntil:
    visible: "(?s).*${SECOND_TASK_TITLE}.*"
    timeout: 10000
- tapOn: "(?s).*History Second.*${SECOND_PORT}.*"
- assertVisible: "연결된 PC"
- assertVisible: "2대의 PC"
- tapOn: "(?s).*${PRIMARY_PORT}.*"
- extendedWaitUntil:
    visible: "(?s)${PRIMARY_TASK_TITLE}(?:\n.*)?"
    timeout: 15000
- assertNotVisible: "(?s).*${SECOND_TASK_TITLE}.*"
- tapOn: "(?s)${PRIMARY_TASK_TITLE}(?:\n.*)?"
- tapOn:
    id: chat-history
- extendedWaitUntil:
    visible: "(?s).*${PRIMARY_HISTORY_PREFIX} session 24.*"
    timeout: 30000
- assertNotVisible: "(?s).*${SECOND_HISTORY_PREFIX} session 24.*"
- tapOn: "(?s).*${PRIMARY_HISTORY_PREFIX} session 24.*"
- extendedWaitUntil:
    visible: "${PRIMARY_HISTORY_PREFIX} message 59"
    timeout: 30000
- assertNotVisible: "${SECOND_HISTORY_PREFIX} message 59"
- takeScreenshot: history-primary-pc-restored

appId: ${APP_ID}
env:
  DESKTOP_PORT: "19738"
  DESKTOP_API_FROM_HOST: http://127.0.0.1:19738
---
- launchApp:
    clearState: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "데스크탑에 연결"
    timeout: 90000
- runScript:
    file: ../scripts/issue-dev-pairing-code.js
- tapOn: "데스크탑 주소"
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "10.0.2.2"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "127.0.0.1"
- tapOn: "포트"
- eraseText
- inputText: ${DESKTOP_PORT}
- tapOn: "연결 코드"
- eraseText
- inputText: ${output.pairingCode}
- scrollUntilVisible:
    element: "연결"
    direction: DOWN
- tapOn: "연결"
- extendedWaitUntil:
    visible: "Chat History Fixture"
    timeout: 40000
- tapOn: "Chat History Fixture"
- tapOn:
    id: chat-history
- extendedWaitUntil:
    visible: "History QA session 24"
    timeout: 30000
- takeScreenshot: history-list
- scrollUntilVisible:
    element: "대화 더 보기"
    direction: DOWN
- tapOn: "대화 더 보기"
- scrollUntilVisible:
    element: "History QA session 0"
    direction: DOWN
- assertVisible: "History QA session 0"
- tapOn: "대화 검색"
- inputText: "session 24"
- tapOn: "검색"
- hideKeyboard
- extendedWaitUntil:
    visible: "History QA session 24"
    timeout: 30000
- assertNotVisible: "History QA session 0"
- tapOn: "History QA session 24"
- extendedWaitUntil:
    visible: "History QA message 59"
    timeout: 30000
- takeScreenshot: history-messages
- scrollUntilVisible:
    element: "이전 메시지 보기"
    direction: UP
- tapOn: "이전 메시지 보기"
- scrollUntilVisible:
    element: "History QA message 1"
    direction: UP
- assertVisible: "History QA message 1"
- takeScreenshot: history-older-messages

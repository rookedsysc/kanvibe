appId: ${APP_ID}
---
- launchApp:
    clearState: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "데스크탑에 연결"
    timeout: 90000
- runScript:
    file: ../scripts/issue-dev-pairing-code.js
- tapOn: "데스크탑 주소"
- eraseText: 30
- inputText: "10.0.2.2"
- tapOn: "포트"
- eraseText: 5
- inputText: ${DESKTOP_PORT}
- tapOn: "연결 코드"
- inputText: ${output.pairingCode}
- scrollUntilVisible:
    element: "연결"
    direction: DOWN
    timeout: 60000
- tapOn: "연결"
- extendedWaitUntil:
    visible: "(?s).*Chat History Fixture.*"
    timeout: 40000
- tapOn: "(?s).*Chat History Fixture.*"
- tapOn:
    id: pane-chat-toggle
- extendedWaitUntil:
    visible:
      id: pane-chat-input
    timeout: 30000
- tapOn:
    id: pane-chat-input
- inputText: "Pane A retained draft"
- hideKeyboard
- tapOn:
    id: "terminal-tab-${SECOND_PANE_ID}"
- assertVisible:
    id: pane-terminal
- assertNotVisible:
    id: pane-chat-input
- takeScreenshot: sibling-remains-terminal
- tapOn:
    id: pane-chat-toggle
- extendedWaitUntil:
    visible:
      id: pane-chat-input
    timeout: 30000
- tapOn:
    id: pane-chat-input
- inputText: ${PROMPT_B}
- tapOn:
    id: pane-chat-send
- hideKeyboard
- extendedWaitUntil:
    visible: "(?s).*live-pane-b received on fixture-fast: ${PROMPT_B}.*"
    timeout: 30000
- takeScreenshot: pane-b-response
- tapOn:
    id: "terminal-tab-${FIRST_PANE_ID}"
- assertVisible: "Pane A retained draft"
- tapOn:
    id: pane-chat-toggle
- assertNotVisible:
    id: pane-chat-input
- tapOn:
    id: "terminal-tab-${SECOND_PANE_ID}"
- assertVisible:
    id: pane-chat-input
- assertVisible: "(?s).*${PROMPT_B}.*"
- tapOn:
    id: "terminal-tab-${FIRST_PANE_ID}"
- assertVisible:
    id: pane-terminal
- assertNotVisible:
    id: pane-chat-input
- tapOn:
    id: pane-chat-toggle
- assertVisible: "Pane A retained draft"
- tapOn:
    id: pane-chat-input
- eraseText: 30
- inputText: ${PROMPT_A}
- tapOn:
    id: pane-chat-send
- hideKeyboard
- extendedWaitUntil:
    visible: "(?s).*live-pane-a received on fixture-deep: ${PROMPT_A}.*"
    timeout: 30000
- takeScreenshot: pane-a-response
- tapOn:
    id: task-more
- tapOn: "대화 기록"
- extendedWaitUntil:
    visible: "(?s).*History QA session 24.*"
    timeout: 30000
- takeScreenshot: history-preserved
- back
- assertVisible:
    id: pane-chat-input
- assertVisible: "(?s).*${PROMPT_A}.*"

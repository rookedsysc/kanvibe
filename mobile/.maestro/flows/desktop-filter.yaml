appId: ${APP_ID}
env:
  DESKTOP_API_FROM_HOST: http://127.0.0.1:19737
tags:
  - journey
---
- launchApp:
    clearState: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "데스크탑에 연결"
    timeout: 30000
- tapOn: "데스크탑 주소"
- eraseText
- inputText: "10.0.2.2"
- tapOn: "포트"
- eraseText: 5
- inputText: "9746"
- tapOn: "연결 코드"
- runScript:
    file: ../scripts/issue-dev-pairing-code.js
- inputText: ${output.pairingCode}
- hideKeyboard
- scrollUntilVisible:
    element: "연결"
    direction: DOWN
    timeout: 10000
- tapOn: "연결"
- extendedWaitUntil:
    visible:
      id: desktop-filter
    timeout: 30000
- assertVisible: "(?s).*Desktop Filter Local.*"
- assertVisible: "(?s).*Desktop Filter Remote.*"
- tapOn:
    id: desktop-filter
- tapOn:
    id: desktop-filter-ssh-qa-remote
- tapOn:
    id: desktop-filter-close
- assertVisible: "(?s).*Desktop Filter Remote.*"
- assertNotVisible: "(?s).*Desktop Filter Local.*"
- takeScreenshot: desktop-filter-remote
- tapOn:
    id: desktop-filter
- tapOn:
    id: desktop-filter-local
- tapOn:
    id: desktop-filter-close
- assertVisible: "(?s).*Desktop Filter Local.*"
- assertVisible: "(?s).*Desktop Filter Remote.*"
- takeScreenshot: desktop-filter-multiple
- tapOn:
    id: desktop-filter
- tapOn:
    id: desktop-filter-ssh-qa-remote
- tapOn:
    id: desktop-filter-close
- assertVisible: "(?s).*Desktop Filter Local.*"
- assertNotVisible: "(?s).*Desktop Filter Remote.*"
- takeScreenshot: desktop-filter-local
- tapOn:
    id: desktop-filter
- tapOn:
    id: desktop-filter-all
- tapOn:
    id: desktop-filter-close
- assertVisible: "(?s).*Desktop Filter Local.*"
- assertVisible: "(?s).*Desktop Filter Remote.*"
- takeScreenshot: desktop-filter-all

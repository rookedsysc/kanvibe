<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="dg2-title dg2-desc"><title id="dg2-title">제안: B에서 화면을 그리고 A의 기존 작업을 쓴다</title><desc id="dg2-desc">B가 machine catalog와 UI를 소유한다. A가 원본 서버와 프로세스를 소유한다. 실제 세션 병합은 하지 않는다.</desc><defs><marker id="dg2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #707988)"/></marker></defs><g font-family="system-ui, sans-serif"><text x="30" y="40" text-anchor="start" fill="var(--ink)" font-size="24"><tspan x="30" dy="0">제안: B에서 화면을 그리고 A의 기존 작업을 쓴다</tspan></text><rect x="30" y="80" width="530" height="470" rx="16" fill="none" stroke="var(--muted, #707988)" stroke-dasharray="7 6"/><text x="48" y="110" text-anchor="start" fill="var(--ink)" font-size="18"><tspan x="48" dy="0">B: 맥북</tspan></text><rect x="610" y="80" width="360" height="470" rx="16" fill="none" stroke="var(--muted, #707988)" stroke-dasharray="7 6"/><text x="628" y="110" text-anchor="start" fill="var(--ink)" font-size="18"><tspan x="628" dy="0">A: 원격 PC</tspan></text><g><rect x="70" y="155" width="450" height="95" rx="12" fill="var(--accent-soft, #edf3ff)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="295.0" y="187" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="295.0" dy="0">로컬 화면(Herdr client)</tspan></text><text x="295.0" y="219" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="295.0" dy="0">Local과 원격 machine을 구분한다</tspan></text></g><g><rect x="70" y="355" width="210" height="110" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="175.0" y="387" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="175.0" dy="0">로컬 서버(Herdr)</tspan></text><text x="175.0" y="419" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="175.0" dy="0">B의 기존 Space</tspan></text></g><g><rect x="315" y="355" width="205" height="110" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="417.5" y="387" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="417.5" dy="0">연결 설정(catalog)</tspan></text><text x="417.5" y="419" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="417.5" dy="0">A와 kanvibe 대상</tspan></text></g><g><rect x="650" y="155" width="280" height="95" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="790.0" y="187" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="790.0" dy="0">원본 서버(Herdr)</tspan></text><text x="790.0" y="219" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="790.0" dy="0">A의 기존 kanvibe</tspan></text></g><g><rect x="650" y="355" width="280" height="110" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="790.0" y="387" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="790.0" dy="0">실행 작업(pane)</tspan></text><text x="790.0" y="419" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="790.0" dy="0">기존 PID와 파일 경로</tspan></text></g><g><path d="M520 203 H650" marker-start="url(#dg2-arrow)" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg2-arrow)"/><text x="585" y="176" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="585" dy="0">SSH 입력과 화면</tspan></text></g><g><path d="M175 250 V355" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg2-arrow)"/><text x="230" y="310" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="230" dy="0">Local 선택</tspan></text></g><g><path d="M418 355 V250" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg2-arrow)"/><text x="466" y="310" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="466" dy="0">프로필 읽기</tspan></text></g><g><path d="M790 250 V355" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg2-arrow)"/><text x="850" y="310" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="850" dy="0">실행 소유</tspan></text></g><text x="500" y="515" text-anchor="middle" fill="var(--ink)" font-size="17"><tspan x="500" dy="0">미구현 제안: 자동 endpoint 선택과 창별 Space 선택은 P0 검증이 필요하다.</tspan></text></g></svg>
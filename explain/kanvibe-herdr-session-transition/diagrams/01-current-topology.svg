<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="dg1-title dg1-desc"><title id="dg1-title">현재 동작: B가 A에서 그린 화면을 받는다</title><desc id="dg1-desc">B의 KanVibe는 SSH로 A의 Herdr client에 접속한다. 서버와 pane은 A에 남는다.</desc><defs><marker id="dg1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #707988)"/></marker></defs><g font-family="system-ui, sans-serif"><text x="30" y="40" text-anchor="start" fill="var(--ink)" font-size="24"><tspan x="30" dy="0">현재 동작: B가 A에서 그린 화면을 받는다</tspan></text><rect x="30" y="80" width="330" height="470" rx="16" fill="none" stroke="var(--muted, #707988)" stroke-dasharray="7 6"/><text x="48" y="110" text-anchor="start" fill="var(--ink)" font-size="18"><tspan x="48" dy="0">B: 맥북</tspan></text><rect x="420" y="80" width="550" height="470" rx="16" fill="none" stroke="var(--muted, #707988)" stroke-dasharray="7 6"/><text x="438" y="110" text-anchor="start" fill="var(--ink)" font-size="18"><tspan x="438" dy="0">A: 원격 PC</tspan></text><g><rect x="65" y="150" width="260" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="195.0" y="182" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="195.0" dy="0">앱 화면(KanVibe)</tspan></text><text x="195.0" y="214" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="195.0" dy="0">SSH PTY의 화면과 입력</tspan></text></g><g><rect x="65" y="355" width="260" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="195.0" y="387" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="195.0" dy="0">태스크 저장(SQLite)</tspan></text><text x="195.0" y="419" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="195.0" dy="0">호스트와 세션 연결</tspan></text></g><g><rect x="465" y="150" width="460" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="695.0" y="182" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="695.0" dy="0">원격 화면(Herdr client)</tspan></text><text x="695.0" y="214" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="695.0" dy="0">UI가 A의 Space 목록을 그린다</tspan></text></g><g><rect x="465" y="355" width="215" height="105" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="572.5" y="387" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="572.5" dy="0">원본 서버(Herdr)</tspan></text><text x="572.5" y="419" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="572.5" dy="0">kanvibe 서버</tspan></text></g><g><rect x="715" y="355" width="215" height="105" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="822.5" y="387" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="822.5" dy="0">실행 작업(pane)</tspan></text><text x="822.5" y="419" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="822.5" dy="0">기존 셸과 에이전트</tspan></text></g><g><path d="M325 200 H465" marker-start="url(#dg1-arrow)" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg1-arrow)"/><text x="395" y="176" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="395" dy="0">SSH 입력과 화면</tspan></text></g><g><path d="M195 250 V355" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg1-arrow)"/><text x="265" y="310" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="265" dy="0">태스크 연결 조회</tspan></text></g><g><path d="M575 250 V355" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg1-arrow)"/><text x="655" y="306" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="655" dy="0">socket 요청</tspan></text></g><g><path d="M680 410 H715" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg1-arrow)"/><text x="700" y="343" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="700" dy="0">실행 소유</tspan></text></g><text x="695" y="510" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="695" dy="0">현재 로컬 코드 기준: machine 자동 등록과 화면 실행은 별도 경로다.</tspan></text></g></svg>
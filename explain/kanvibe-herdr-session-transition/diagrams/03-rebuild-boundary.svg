<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="dg3-title dg3-desc"><title id="dg3-title">제안: 구조를 재생성하고 같은 파일을 사용한다</title><desc id="dg3-desc">stopped 원본의 지원되는 구조를 읽어 새 Space를 만든다. 파일은 같은 작업 디렉터리에 남는다. 프로세스는 새로 시작한다.</desc><defs><marker id="dg3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #707988)"/></marker></defs><g font-family="system-ui, sans-serif"><text x="30" y="40" text-anchor="start" fill="var(--ink)" font-size="24"><tspan x="30" dy="0">제안: 구조를 재생성하고 같은 파일을 사용한다</tspan></text><rect x="30" y="100" width="280" height="285" rx="16" fill="none" stroke="var(--muted, #707988)" stroke-dasharray="7 6"/><text x="48" y="130" text-anchor="start" fill="var(--ink)" font-size="18"><tspan x="48" dy="0">원본: stopped 독립 세션</tspan></text><rect x="690" y="100" width="280" height="285" rx="16" fill="none" stroke="var(--muted, #707988)" stroke-dasharray="7 6"/><text x="708" y="130" text-anchor="start" fill="var(--ink)" font-size="18"><tspan x="708" dy="0">대상: kanvibe 서버</tspan></text><g><rect x="55" y="190" width="230" height="120" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="170.0" y="222" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="170.0" dy="0">저장 자료(snapshot)</tspan></text><text x="170.0" y="254" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="170.0" dy="0">경로와 지원 배치</tspan><tspan x="170.0" dy="24.8">원본은 보존</tspan></text></g><g><rect x="365" y="190" width="270" height="120" rx="12" fill="var(--accent-soft, #edf3ff)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="500.0" y="222" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="500.0" dy="0">이전 처리(KanVibe)</tspan></text><text x="500.0" y="254" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="500.0" dy="0">형식과 경로를 확인</tspan><tspan x="500.0" dy="24.8">새 ID로 구조를 만든다</tspan></text></g><g><rect x="715" y="190" width="230" height="120" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="830.0" y="222" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="830.0" dy="0">새 작업 공간(Space)</tspan></text><text x="830.0" y="254" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="830.0" dy="0">새 pane과 새 프로세스</tspan><tspan x="830.0" dy="24.8">원본 PID를 받지 않음</tspan></text></g><g><rect x="365" y="380" width="270" height="95" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="500.0" y="412" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="500.0" dy="0">단계 저장(operation)</tspan></text><text x="500.0" y="444" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="500.0" dy="0">생성 ID와 연결 반영 상태</tspan></text></g><g><rect x="230" y="535" width="540" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="500.0" y="567" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="500.0" dy="0">같은 작업 디렉터리(worktree)</tspan></text><text x="500.0" y="599" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="500.0" dy="0">파일 복사와 Git reset을 실행하지 않는다</tspan></text></g><g><path d="M285 250 H365" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg3-arrow)"/><text x="325" y="172" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="325" dy="0">읽기</tspan></text></g><g><path d="M635 250 H715" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg3-arrow)"/><text x="675" y="172" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="675" dy="0">생성</tspan></text></g><g><path d="M500 310 V380" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg3-arrow)"/><text x="565" y="350" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="565" dy="0">단계 기록</tspan></text></g><g><path d="M170 310 V585 H230" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg3-arrow)"/><text x="145" y="484" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="145" dy="0">기존 파일</tspan></text></g><g><path d="M830 310 V585 H770" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg3-arrow)"/><text x="860" y="484" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="860" dy="0">같은 경로</tspan></text></g></g></svg>
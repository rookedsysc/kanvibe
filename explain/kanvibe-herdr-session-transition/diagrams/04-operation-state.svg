<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-labelledby="dg4-title dg4-desc"><title id="dg4-title">제안: 상태를 기록하고 불확실한 쓰기를 멈춘다</title><desc id="dg4-desc">정상 경로는 planned에서 completed로 진행한다. 결과가 불명확하면 attention으로 멈춘다. 복구는 연결만 대상으로 한다.</desc><defs><marker id="dg4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #707988)"/></marker></defs><g font-family="system-ui, sans-serif"><text x="30" y="40" text-anchor="start" fill="var(--ink)" font-size="24"><tspan x="30" dy="0">제안: 상태를 기록하고 불확실한 쓰기를 멈춘다</tspan></text><g><rect x="60" y="120" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="180.0" y="152" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="180.0" dy="0">planned</tspan></text><text x="180.0" y="184" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="180.0" dy="0">원본과 계획 확인</tspan></text></g><g><rect x="380" y="120" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="500.0" y="152" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="500.0" dy="0">applying</tspan></text><text x="500.0" y="184" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="500.0" dy="0">백업과 대상 준비</tspan></text></g><g><rect x="700" y="120" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="820.0" y="152" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="820.0" dy="0">verifying</tspan></text><text x="820.0" y="184" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="820.0" dy="0">배치와 연결 검증</tspan></text></g><g><rect x="700" y="330" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="820.0" y="362" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="820.0" dy="0">committed</tspan></text><text x="820.0" y="394" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="820.0" dy="0">조건부 연결 반영</tspan></text></g><g><rect x="380" y="330" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="500.0" y="362" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="500.0" dy="0">completed</tspan></text><text x="500.0" y="394" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="500.0" dy="0">검증 완료</tspan></text></g><g><rect x="60" y="330" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="180.0" y="362" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="180.0" dy="0">failed / cancelled</tspan></text><text x="180.0" y="394" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="180.0" dy="0">원본 연결 유지</tspan></text></g><g><rect x="60" y="535" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="180.0" y="567" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="180.0" dy="0">attention</tspan></text><text x="180.0" y="599" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="180.0" dy="0">부분 완료 확인 필요</tspan></text></g><g><rect x="380" y="535" width="240" height="100" rx="12" fill="var(--surface, #f7f8fa)" stroke="var(--line, #aeb5c2)" stroke-width="1.5"/><text x="500.0" y="567" text-anchor="middle" fill="var(--ink)" font-size="19"><tspan x="500.0" dy="0">reverted</tspan></text><text x="500.0" y="599" text-anchor="middle" fill="var(--ink)" font-size="16"><tspan x="500.0" dy="0">연결만 복구</tspan></text></g><g><path d="M300 170 H380" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="340" y="102" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="340" dy="0">쓰기 조건 충족</tspan></text></g><g><path d="M620 170 H700" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="660" y="102" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="660" dy="0">대상 확인</tspan></text></g><g><path d="M820 220 V330" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="885" y="280" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="885" dy="0">검증과 CAS 성공</tspan></text></g><g><path d="M700 380 H620" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="660" y="312" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="660" dy="0">기록 대조</tspan></text></g><g><path d="M500 220 V270 H180 V330" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="330" y="258" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="330" dy="0">생성 전 실패 또는 취소</tspan></text></g><g><path d="M940 170 H975 V670 H180 V635" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="778" y="660" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="778" dy="0">생성 결과 또는 저장 상태 불명</tspan></text></g><g><path d="M500 430 V535" fill="none" stroke="var(--muted, #707988)" stroke-width="2" marker-end="url(#dg4-arrow)"/><text x="580" y="490" text-anchor="middle" fill="var(--ink)" font-size="15"><tspan x="580" dy="0">소유권 확인 후 복구</tspan></text></g><text x="495" y="720" text-anchor="middle" fill="var(--ink)" font-size="17"><tspan x="495" dy="0">미구현 제안: 연결 복구는 새 프로세스나 파일 변경을 실행 취소하지 않는다.</tspan></text></g></svg>
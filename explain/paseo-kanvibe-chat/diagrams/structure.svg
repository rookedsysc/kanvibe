<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 368" role="img" aria-labelledby="dg1-title dg1-desc" style="min-width:768px">
<title id="dg1-title">Paseo와 KanVibe의 채팅 연결 구조</title>
<desc id="dg1-desc">Paseo 앱은 데몬을 통해 공급자 연결과 통신한다. KanVibe 앱은 Pane Chat 서비스를 통해 터미널 pane에 입력하고 공급자 기록을 읽는다.</desc>

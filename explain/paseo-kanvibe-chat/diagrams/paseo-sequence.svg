<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 464" role="img" aria-labelledby="dg2-title dg2-desc" style="min-width:768px">
<title id="dg2-title">Paseo에서 메시지 보내기와 복구</title>
<desc id="dg2-desc">앱이 데몬에 에이전트 ID를 보낸다. 데몬이 공급자에 프롬프트를 전달하고 이벤트를 앱에 보낸다. 이벤트가 빠지면 앱이 타임라인을 조회한다.</desc>
<defs>
<marker id="dg2-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #555f69)"/></marker>
<marker id="dg2-live" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--accent, #276433)" stroke-width="1.6"/></marker>
</defs>
<g transform="scale(0.83478261)">
<text x="24" y="32" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" text-anchor="start">Paseo에서 메시지 보내기와 복구</text>
<rect x="28" y="52" width="192" height="44" rx="6" fill="var(--bg, #ffffff)" stroke="var(--line, #bbc2c8)" stroke-width="1"/>
<text x="124" y="81" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">채팅 앱</text>
<line x1="124" y1="96" x2="124" y2="530" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="252" y="52" width="192" height="60" rx="6" fill="var(--accent-soft, #ebf5ea)" stroke="var(--accent, #276433)" stroke-width="1"/>
<text x="348" y="77" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">데몬</text>
<text x="348" y="99" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" text-anchor="middle">전송 / 타임라인</text>
<line x1="348" y1="112" x2="348" y2="530" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="476" y="52" width="192" height="44" rx="6" fill="var(--bg, #ffffff)" stroke="var(--line, #bbc2c8)" stroke-width="1"/>
<text x="572" y="81" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">공급자 연결</text>
<line x1="572" y1="96" x2="572" y2="530" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<g data-step="1">
<rect x="10" y="121" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="137" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="142" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
<text x="48" y="143" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">채팅에서 전송</text>
<line x1="124" y1="188" x2="348" y2="188" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg2-arrow)"/>
<text x="236" y="180" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">에이전트 ID + 프롬프트</text>
</g>
<g data-step="2">
<rect x="10" y="197" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="213" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="218" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
<text x="48" y="219" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">공급자에 전달하고 전송 결과를 회신</text>
<line x1="348" y1="264" x2="572" y2="264" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg2-arrow)"/>
<text x="460" y="256" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">공급자에 프롬프트 전달</text>
<line x1="348" y1="300" x2="124" y2="300" stroke="var(--muted, #555f69)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg2-arrow)"/>
<text x="236" y="292" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">수락 또는 거절</text>
</g>
<g data-step="3">
<rect x="10" y="309" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="325" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="330" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text x="48" y="331" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">답변이 들어오는 동안 화면 갱신</text>
<line x1="572" y1="376" x2="348" y2="376" stroke="var(--accent, #276433)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg2-live)"/>
<text x="460" y="368" fill="var(--accent, #276433)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">텍스트 조각 / 도구 이벤트</text>
<line x1="348" y1="412" x2="124" y2="412" stroke="var(--accent, #276433)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg2-live)"/>
<text x="236" y="404" fill="var(--accent, #276433)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">순번이 붙은 에이전트 이벤트</text>
</g>
<g data-step="4">
<rect x="10" y="421" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="437" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="442" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text x="48" y="443" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">이벤트를 놓쳤으면 이어서 조회</text>
<line x1="124" y1="488" x2="348" y2="488" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg2-arrow)"/>
<text x="236" y="480" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">마지막 순번 이후 조회</text>
<line x1="348" y1="524" x2="124" y2="524" stroke="var(--muted, #555f69)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg2-arrow)"/>
<text x="236" y="516" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">완성된 타임라인 항목</text>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 552" role="img" aria-labelledby="dg3-title dg3-desc" style="min-width:768px">
<title id="dg3-title">KanVibe에서 메시지 보내기와 표시</title>
<desc id="dg3-desc">Pane Chat 서비스가 pane과 공급자 기록을 연결한다. 대상이 바뀌면 거절한다. 유효하면 CLI 또는 Codex 스레드로 보내고 연결된 기록을 다시 읽어 표시한다.</desc>
<defs>
<marker id="dg3-arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted, #555f69)"/></marker>
<marker id="dg3-live" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="var(--accent, #276433)" stroke-width="1.6"/></marker>
</defs>
<g transform="scale(0.83478261)">
<text x="24" y="32" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" text-anchor="start">KanVibe에서 메시지 보내기와 표시</text>
<rect x="28" y="52" width="192" height="44" rx="6" fill="var(--bg, #ffffff)" stroke="var(--line, #bbc2c8)" stroke-width="1"/>
<text x="124" y="81" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Pane Chat</text>
<line x1="124" y1="96" x2="124" y2="638" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="252" y="52" width="192" height="60" rx="6" fill="var(--accent-soft, #ebf5ea)" stroke="var(--accent, #276433)" stroke-width="1"/>
<text x="348" y="77" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Pane Chat 서비스</text>
<text x="348" y="99" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" text-anchor="middle">전송 / 기록 조회</text>
<line x1="348" y1="112" x2="348" y2="638" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="476" y="52" width="192" height="60" rx="6" fill="var(--bg, #ffffff)" stroke="var(--line, #bbc2c8)" stroke-width="1"/>
<text x="572" y="77" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">터미널 pane</text>
<text x="572" y="99" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="400" text-anchor="middle">CLI / Codex 스레드</text>
<line x1="572" y1="112" x2="572" y2="638" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="700" y="52" width="192" height="44" rx="6" fill="var(--bg, #ffffff)" stroke="var(--line, #bbc2c8)" stroke-width="1"/>
<text x="796" y="81" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" text-anchor="middle">공급자 기록</text>
<line x1="796" y1="96" x2="796" y2="638" stroke="var(--line, #bbc2c8)" stroke-width="1.2" stroke-dasharray="4 4"/>
<g data-step="1">
<rect x="10" y="121" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="137" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="142" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
<text x="48" y="143" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">pane이 연 대화를 확인</text>
<line x1="348" y1="188" x2="572" y2="188" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg3-arrow)"/>
<text x="460" y="180" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">화면 / 프로세스 확인</text>
<line x1="348" y1="224" x2="796" y2="224" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg3-arrow)"/>
<text x="572" y="216" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">해당 대화의 기록 조회</text>
<line x1="348" y1="260" x2="124" y2="260" stroke="var(--muted, #555f69)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg3-arrow)"/>
<text x="236" y="252" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">기록 + 대상 토큰</text>
</g>
<g data-step="2">
<rect x="10" y="269" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="285" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="290" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
<text x="48" y="291" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">전송 직전에 대상을 재확인</text>
<line x1="124" y1="336" x2="348" y2="336" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg3-arrow)"/>
<text x="236" y="328" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">대상 토큰 + 프롬프트</text>
<line x1="348" y1="372" x2="124" y2="372" stroke="var(--muted, #555f69)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg3-arrow)"/>
<text x="236" y="364" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">대상이 바뀌었으면 거절</text>
</g>
<g data-step="3">
<rect x="10" y="381" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="397" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="402" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
<text x="48" y="403" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">대상이 같으면 실행 중인 대화에 전달</text>
<line x1="348" y1="448" x2="572" y2="448" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg3-arrow)"/>
<text x="460" y="440" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">붙여넣기 + Enter</text>
<line x1="348" y1="484" x2="572" y2="484" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg3-arrow)"/>
<text x="460" y="476" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">확인된 Codex 스레드 호출</text>
</g>
<g data-step="4">
<rect x="10" y="493" width="900" height="32" rx="6" fill="var(--surface, #f5f5f5)" stroke="none" stroke-width="1"/>
<circle cx="28" cy="509" r="12" fill="var(--accent, #276433)"/>
<text x="28" y="514" fill="var(--bg, #ffffff)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text>
<text x="48" y="515" fill="var(--ink, #242424)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700" text-anchor="start">연결된 기록에서 답변 표시</text>
<line x1="348" y1="560" x2="796" y2="560" stroke="var(--muted, #555f69)" stroke-width="1.6" marker-end="url(#dg3-arrow)"/>
<text x="572" y="552" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">최신 대화 기록 재조회</text>
<line x1="796" y1="596" x2="348" y2="596" stroke="var(--muted, #555f69)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg3-arrow)"/>
<text x="572" y="588" fill="var(--muted, #555f69)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">기록에 추가된 메시지</text>
<line x1="348" y1="632" x2="124" y2="632" stroke="var(--accent, #276433)" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#dg3-live)"/>
<text x="236" y="624" fill="var(--accent, #276433)" font-family="Noto Sans CJK KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" text-anchor="middle">새 메시지 / 상태</text>
</g>
</g>
</svg>

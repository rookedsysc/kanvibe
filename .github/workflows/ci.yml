name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  rust:
    name: Rust (fmt, clippy, test, release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI 링크에 필요한 시스템 라이브러리와, HTML 미리보기(gpui-webview)가 링크하는 WebKitGTK 4.1이다.
      # tmux가 있으면 실제 tmux를 쓰는 런타임 시험도 돈다. OpenCode 플러그인 전송 시험은 러너에 기본 탑재된 node로 생성된 JS를 실행한다.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libwebkit2gtk-4.1-dev tmux

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --workspace

      - name: Release build
        run: cargo build --workspace --release

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    name: Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm check

      - name: Test
        run: pnpm test

      # 렌더러는 브라우저 번들이라 main 전용 Node 모듈을 끌어오면 여기서만 깨진다.
      # tsc와 vitest는 Node 해상도로 돌아 그 위반을 통과시키므로 빌드를 따로 게이트로 둔다.
      - name: Build
        run: pnpm build

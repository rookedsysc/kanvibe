name: Track Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Record download and star count
        run: node scripts/track-stats.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/downloads.json docs/data/downloads-monthly.json docs/images/readme/downloads-chart.svg docs/images/readme/downloads-chart-monthly.svg docs/data/stars.json docs/data/stars-monthly.json docs/images/readme/star-history-chart.svg docs/images/readme/star-history-chart-monthly.svg
          git diff --cached --quiet || git commit -m "chore(stats): update project stats $(date -u +%F)"
          git push

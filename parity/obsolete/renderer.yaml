# Rust로 옮기지 않는 src/desktop/renderer/** TS 테스트.
- id: TS-renderer-keyboardShortcut-37f0c0
  reason: "platform 인자 없이 Meta·Ctrl을 그대로 적던 옛 녹화 분기다. TS에서도 이 분기를 부르는 곳은 이 테스트뿐이고(ShortcutSettingsRoute는 항상 platform을 넘김) Rust capture_shortcut_from_event는 ShortcutPlatform을 필수 인자로 받는다. 옛 표기 저장값은 canonicalize 경로(TS-main-appSettingsService-f068f7 등)로 검증한다."
- id: TS-renderer-diff-403f37
  reason: "renderer `readTaskWorkspaceFile`가 IPC 응답을 `{ ok, file }`로 감싸던 어댑터다. Rust 화면은 같은 프로세스에서 kanvibe-services `DiffService::read_task_workspace_file`을 직접 부르고 결과 타입이 그대로 Result다(계획 AD-8). 읽기 결과는 TS-main-diffService-cd6dbd·b7242f 매핑 테스트가 검증한다."
- id: TS-renderer-diff-69700b
  reason: "Electron IPC가 붙인 `Error invoking remote method ...` 문자열에서 실패 사유를 다시 파싱하던 동작이다. Rust에는 IPC 경계가 없고 서비스가 `TaskWorkspaceFileFailure` 열거형을 돌려주므로 문자열 파싱이 없다(계획 AD-8). 사유별 분기는 TS-main-diffService-6f363c·d7fc07·3a800c 매핑 테스트가 검증한다."
- id: TS-renderer-diff-1c3cff
  reason: "IPC 오류 문자열에서 사유를 읽지 못하면 unreadable로 바꾸던 파싱 분기다. Rust 서비스는 원격 명령 실패를 바로 `Unreadable`로 돌려주므로 화면 쪽 문자열 파싱이 없다(계획 AD-8). 동작은 TS-main-diffService-fa41c2 매핑 테스트가 검증한다."
- id: TS-components-ProjectSettings-9f23e3
  reason: "ProjectSettings variant=\"modal\"(우상단 모달)의 Escape 닫기를 검증한다. 모달 변형은 부르는 곳이 없는 dead code라 옮기지 않았고(계획 Scope 삭제 목록), Rust 설정 화면은 page 변형(SettingsView)만 있어 Escape로 닫을 패널이 없다."
- id: TS-renderer-useUnreadNotificationCountByTask-952640
  reason: "React가 같은 객체를 받으면 리렌더를 건너뛰도록 집계 객체의 참조를 유지하는지 보는 테스트다. GPUI 보드는 렌더마다 알림 목록에서 작업별 미읽음 수를 다시 세고 메모 참조 비교가 없다. 작업별 집계 자체는 board_view unread_counts_are_per_task_and_skip_read_ones가 확인한다."
- id: TS-renderer-useTaskDiffStats-2980f2
  reason: "호출자가 렌더마다 새 배열을 넘겨도 useEffect 의존성이 같은 목록이면 다시 조회하지 않는지 보는 React 훅 의존성 테스트다. Rust 보드는 렌더와 무관한 5초 주기 루프가 그 시점의 목록으로 한 번 조회하므로 렌더가 조회를 일으키지 않는다."
- id: TS-renderer-BoardCommandProvider-1df816
  reason: "Electron main이 before-input-event로 가로챈 새 작업 단축키를 IPC(onCreateTaskShortcut)로 렌더러에 다시 보내는 다리를 검증한다. GPUI 앱은 단축키를 OpenCreateTask 액션 하나로 보드에 바로 보내 다리 경로가 없다. 같은 동작은 board_view new_task_shortcut_opens_the_create_task_modal이 확인한다."
- id: TS-renderer-BoardCommandProvider-1058fc
  reason: "IPC 단축키 다리 이벤트를 blocker가 있을 때 무시하는지 보는 테스트다. GPUI에는 다리 이벤트가 없고 모든 단축키가 같은 액션 경로로 와서 has_shortcut_blocker 하나로 막는다(board_shortcuts_are_ignored_behind_a_blocker)."
- id: TS-renderer-BoardCommandProvider-9df8b8
  reason: "IPC(onCommandPaletteShortcut)로 온 팔레트 단축키를 여는지 보는 Electron 다리 테스트다. GPUI는 OpenCommandPalette 액션이 직접 와서 다리가 없다(palette_sync_command_runs_the_background_sync 등이 액션 경로를 쓴다)."
- id: TS-renderer-BoardCommandProvider-2e0b9e
  reason: "IPC로 온 알림 단축키를 알림 처리기에 넘기는 Electron 다리 테스트다. GPUI는 ToggleNotificationCenter 액션이 바로 보드에 온다(notification_shortcut_opens_only_the_notification_center)."
- id: TS-renderer-BoardCommandProvider-6f7bf9
  reason: "Chromium 페이지 새로 고침(Cmd/Ctrl+R)을 막는 테스트다. GPUI 창에는 페이지 새로 고침이 없어 막을 기본 동작이 없다."
- id: TS-renderer-TaskQuickSearchDialog-6f6fde
  reason: "상세로 이동할 때 xterm DOM에 포커스를 다시 주라고 requestActiveTerminalFocusAfterUiSettles를 부르는지 보는 테스트다. GPUI 작업 상세는 화면을 만들 때 터미널 FocusHandle에 포커스를 주므로 따로 보낼 포커스 요청이 없다."
- id: TS-renderer-TaskQuickSearchDialog-276c97
  reason: "저장된 단축키가 Ctrl+R이어도 Chromium 새로 고침 차단 규칙 때문에 열지 않는지 보는 테스트다. GPUI 창에는 페이지 새로 고침 단축키가 없어 막을 규칙이 없다."
- id: TS-renderer-useTaskDiffStats-f1cf65
  reason: "useBoardTaskDiffStats의 isEnabled(isMounted) 플래그가 false인 동안 조회하지 않는지 보는 React hydration 가드 테스트다. GPUI 보드는 마운트 전 단계가 없고, 집계 폴링은 보드 뷰가 첫 데이터를 받은 뒤에 그 뷰가 가진 Task로 시작해 뷰가 사라지면 함께 멈춘다."
- id: TS-renderer-kanban-603e12
  reason: "렌더러 IPC 모듈이 작업 자원 정리 함수를 내보내지 않는지 보는 노출 면 테스트다. Rust 앱은 범용 IPC 없이 화면이 서비스 메서드를 직접 부르고(계획 AD-8) 보드 서비스(views/board/services.rs)에 자원 정리 메서드를 두지 않는다."
- id: TS-renderer-useTrackedAction-492d5f
  reason: "React 공용 훅(useTrackedAction)의 중복 실행 막기를 단독으로 보는 테스트다. Rust 화면은 이 훅 없이 각 동작이 진행 상태를 직접 들고, 같은 동작은 화면 시험으로 확인한다(repeated_enter_while_creating_sends_one_request, opening_notification_is_not_repeated_and_failure_is_toasted)."
- id: TS-renderer-useTrackedAction-d005a7
  reason: "React 공용 훅의 실패 사유 보관과 마지막 인자로 다시 시도를 단독으로 보는 테스트다. Rust 화면은 실패 사유와 다시 시도를 동작마다 직접 들고 화면 시험으로 확인한다(failed_mark_all_read_shows_the_reason, failed_load_more_shows_the_reason_and_retry_requests_the_same_page)."
- id: TS-renderer-useTrackedAction-be8a17
  reason: "React 공용 훅의 clearError 함수 호출을 보는 테스트다. Rust 화면에는 이 훅이 없고, 실패 사유는 다시 시도가 성공하면 그 화면 상태에서 지워진다(unreadable_notifications_show_the_reason_and_retry_loads_them)."
- id: TS-renderer-textContextMenu-e064df
  reason: "window.kanvibeDesktop 브리지가 없는 브라우저 실행에서 브라우저 기본 우클릭 메뉴를 막지 않는지 검사한다. Rust 앱은 늘 데스크톱 앱 하나로만 돌고 브리지 없는 브라우저 빌드가 없으며, 글자 메뉴는 pane 채팅 화면이 직접 그린다(components/text_context_menu.rs)."

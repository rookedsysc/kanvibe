# Rust로 옮기지 않는 저장소 루트의 TS 테스트(`kanvibe.test.ts`, `qa/electron/lib/*.test.mjs`). 각 이유는 Rust 쪽에 해당 경로가 없는 근거를 적는다.
- id: TS-root-kanvibe-edf0a8
  reason: "레거시 소스 실행기 kanvibe.sh가 Linux에서 Node 24 설치 채널을 고르는지 검사한다. 계획(삭제 목록)이 kanvibe.sh를 옮기지 않고 지우며, Rust 앱은 cargo가 만든 실행 파일 하나를 .deb·tarball·.app으로 배포해(packaging/) 설치하거나 버전을 맞출 Node 런타임이 없다."
- id: TS-root-fixtureRepository-c44736
  reason: "Electron QA 도우미가 공개 GitHub fixture 저장소를 기본값으로 쓰는지 검사한다. Rust QA는 네트워크에서 저장소를 받지 않고 parity/fixtures/make_git_repos.py가 fixture 루트 안에 결정적인 로컬 git 저장소를 만든다. 이 도구는 Python이라 crates의 `// parity:` 매핑 대상이 아니고, Rust 통합 테스트는 각자 임시 디렉터리에 저장소를 만든다(kanvibe-runtime tests/support RuntimeFixture::create_git_repository)."
- id: TS-root-fixtureRepository-02dab3
  reason: "Electron QA 도우미가 fixture 저장소를 clone하고 관리 밖 루트에 브랜치 worktree를 만드는지 검사한다. Rust QA에는 clone 단계가 없고, 화면 캡처의 저장소·worktree는 make_git_repos.py가 fixture 루트(/tmp/kanvibe-parity)에 미리 만든다. worktree 생성 자체는 kanvibe-runtime tests/runtime_wiring.rs(tmux_task_gets_worktree_session_and_signed_hook_target)가 실제 git으로 확인한다."
- id: TS-root-fixtureRepository-65f312
  reason: "병렬 Electron QA 실행마다 프로젝트 이름·clone 디렉터리·브랜치·worktree 경로를 따로 잡는지 검사한다. Rust 화면 캡처는 공유 fixture 루트를 `flock /tmp/kanvibe-parity.lock`으로 한 번에 하나씩 쓰도록 직렬화하고, Rust 통합 테스트는 테스트마다 새 임시 디렉터리를 쓴다. 실행별 이름을 고르는 도우미가 없다."
- id: TS-root-launchElectron-a3538c
  reason: "Playwright가 Electron에 붙을 Chromium DevTools(CDP) 포트를 환경 변수로 받는지 검사한다. GPUI 앱에는 CDP가 없고, Rust QA는 --control-socket 유닉스 소켓(crates/kanvibe-app/src/qa/control.rs)으로 앱을 조종한다."
- id: TS-root-launchElectron-9a083f
  reason: "CDP 포트를 정하지 않으면 동적으로 고르는지 검사한다. GPUI 앱에는 CDP 포트가 없다(a3538c와 같은 이유). 제어 소켓 경로는 실행하는 쪽이 인자로 준다."
- id: TS-root-launchElectron-b97b0b
  reason: "appDataDir를 빼고 부른 Electron 런처가 실행마다 임시 DB를 새로 만드는지 검사한다. Rust 앱은 --qa-harness로 뜨고 --data-dir가 없으면 DB를 열지 않는다(desktop_process tests automated_qa_starts_the_server_only_on_a_launcher_port의 without_data). 임시 디렉터리를 대신 만들어 주는 런처가 없다."
- id: TS-root-launchElectron-599b89
  reason: "Electron 런처가 자동 QA 실행마다 설치된 앱·pnpm dev와 겹치지 않는 hook 포트를 골라 --kanvibe-hook-port로 넘기는지 검사한다. Rust 화면 캡처(capture_rust.py)는 hook 포트를 넘기지 않고, 앱은 --qa-harness에서 런처 포트가 없으면 hook 서버를 띄우지 않는다(automated_qa_starts_the_server_only_on_a_launcher_port). 포트를 고르는 런처가 없다."

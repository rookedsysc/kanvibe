<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587.765625 450" role="graphics-document document" aria-roledescription="pie" height="600" style="display: block; margin: 0px auto; width: 784px; height: 600px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#a44141;}#kanvibeDiagram .error-text{fill:#ddd;stroke:#ddd;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:lightgrey;stroke:lightgrey;}#kanvibeDiagram .marker.cross{stroke:lightgrey;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#kanvibeDiagram .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#kanvibeDiagram .pieTitleText{text-anchor:middle;font-size:25px;fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;}#kanvibeDiagram .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#ccc;font-size:17px;}#kanvibeDiagram .legend text{fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#kanvibeDiagram .node .neo-node{stroke:#ccc;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node path{stroke:url(#kanvibeDiagram-gradient);stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-92.5,160.215L0,0Z" fill="#0b0000" class="pieCircle"></path><path d="M-92.5,160.215A185,185,0,0,1,-167.667,-78.184L0,0Z" fill="#4d1037" class="pieCircle"></path><path d="M-167.667,-78.184A185,185,0,0,1,-63.274,-173.843L0,0Z" fill="#3f5258" class="pieCircle"></path><path d="M-63.274,-173.843A185,185,0,0,1,0,-185L0,0Z" fill="#4f2f1b" class="pieCircle"></path><text transform="translate(134.02220839760824,35.911142507974745)" class="slice" style="text-anchor: middle;">58%</text><text transform="translate(-132.32822691631645,41.72292968121798)" class="slice" style="text-anchor: middle;">24%</text><text transform="translate(-93.73814130667287,-102.29723048240469)" class="slice" style="text-anchor: middle;">13%</text><text transform="translate(-24.093684651286704,-136.64207573044385)" class="slice" style="text-anchor: middle;">6%</text><text x="0" y="-200" class="pieTitleText">Review outcomes</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(11, 0, 0); stroke: rgb(11, 0, 0);"></rect><text x="22" y="14">approved</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(77, 16, 55); stroke: rgb(77, 16, 55);"></rect><text x="22" y="14">changes</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(63, 82, 88); stroke: rgb(63, 82, 88);"></rect><text x="22" y="14">pending</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(79, 47, 27); stroke: rgb(79, 47, 27);"></rect><text x="22" y="14">closed</text></g></g></svg>
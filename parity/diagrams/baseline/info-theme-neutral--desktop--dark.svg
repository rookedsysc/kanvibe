<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" role="graphics-document document" aria-roledescription="info" height="294" style="display: block; margin: 0px auto; width: 784px; height: 294px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#552222;}#kanvibeDiagram .error-text{fill:#552222;stroke:#552222;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:#666;stroke:#666;}#kanvibeDiagram .marker.cross{stroke:#666;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .node .neo-node{stroke:#999;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node path{stroke:url(#kanvibeDiagram-gradient);stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><text x="100" y="40" class="version" font-size="32" style="text-anchor: middle;">v11.15.0</text></g></svg>
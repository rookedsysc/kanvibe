<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 156" role="graphics-document document" aria-roledescription="packet" height="119" style="display: block; margin: 0px auto; width: 784px; height: 119px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#a44141;}#kanvibeDiagram .error-text{fill:#ddd;stroke:#ddd;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:lightgrey;stroke:lightgrey;}#kanvibeDiagram .marker.cross{stroke:lightgrey;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .packetByte{font-size:10px;}#kanvibeDiagram .packetByte.start{fill:#e0dfdf;}#kanvibeDiagram .packetByte.end{fill:#e0dfdf;}#kanvibeDiagram .packetLabel{fill:#e0dfdf;font-size:12px;}#kanvibeDiagram .packetTitle{fill:#e0dfdf;font-size:14px;}#kanvibeDiagram .packetBlock{stroke:#e0dfdf;stroke-width:1;fill:#333;}#kanvibeDiagram .node .neo-node{stroke:#ccc;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rg
<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" height="784" style="display: block; margin: 0px auto; width: 784px; height: 784px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#552222;}#kanvibeDiagram .error-text{fill:#552222;stroke:#552222;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:#333333;stroke:#333333;}#kanvibeDiagram .marker.cross{stroke:#333333;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .node .neo-node{stroke:#9370DB;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="5" width="232" height="232" fill="#ECECFF"></rect><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 10) rotate(0)">Plan</text></g><g class="quadrant"><rect x="31" y="5" width="232" height="232" fill="#f1f1ff"></rect><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 10) rotate(0)">Do</text></g><g class="quadrant"><rect x="31" y="237" width="232" height="232" fill="#f6f6ff"></rect><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 242) rotate(0)">Delegate</text></g><g class="quadrant"><rect x="263" y="237" width="232" height="232" fill="#fbfbff"></rect><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 242) rotate(0)">Delete</text></g></g><g class="border"><line x1="30" y1="5" x2="496" y2="5" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="495" y1="6" x2="495" y2="468" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="31" y1="6" x2="31" y2="468" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="263" y1="6" x2="263" y2="468" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line><line x1="32" y1="237" x2="494" y2="237" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="263" cy="237" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(263, 242) rotate(0)">Point C</text></g><g class="data-point"><circle cx="123.8" cy="97.79999999999998" r="8" fill="#109060" stroke="#000000" stroke-width="3px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(123.8, 102.79999999999998) rotate(0)">Point B</text></g><g class="data-point"><circle cx="448.6" cy="376.20000000000005" r="10" fill="#ff3300" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(448.6, 381.20000000000005) rotate(0)">Point A</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="start" transform="translate(31, 479) rotate(0)">Urgent</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="start" transform="translate(5, 469) rotate(-90)">Important ⟶</text></g></g><g class="title"></g></g></svg>
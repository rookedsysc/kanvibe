<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" height="784" style="display: block; margin: 0px auto; width: 784px; height: 784px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#a44141;}#kanvibeDiagram .error-text{fill:#ddd;stroke:#ddd;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:lightgrey;stroke:lightgrey;}#kanvibeDiagram .marker.cross{stroke:lightgrey;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .node .neo-node{stroke:#ccc;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node path{stroke:url(#kanvibeDiagram-gradient);stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#fde68a"></rect><text x="0" y="0" fill="#7c2d12" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">We should expand</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#bfdbfe"></rect><text x="0" y="0" fill="#1e3a8a" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Need to promote</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#fecaca"></rect><text x="0" y="0" fill="#7f1d1d" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Re-evaluate</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#bbf7d0"></rect><text x="0" y="0" fill="#14532d" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">May be improved</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke: rgb(29, 78, 216); stroke-width: 2;"></line><line x1="495" y1="46" x2="495" y2="468" style="stroke: rgb(29, 78, 216); stroke-width: 2;"></line><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(29, 78, 216); stroke-width: 2;"></line><line x1="31" y1="46" x2="31" y2="468" style="stroke: rgb(29, 78, 216); stroke-width: 2;"></line><line x1="263" y1="46" x2="263" y2="468" style="stroke: rgb(220, 38, 38); stroke-width: 1;"></line><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(220, 38, 38); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="392.92" cy="324.84" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="0px"></circle><text x="0" y="0" fill="#4c1d95" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(392.92, 329.84) rotate(0)">Campaign D</text></g><g class="data-point"><circle cx="295.47999999999996" cy="176.44" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="0px"></circle><text x="0" y="0" fill="#4c1d95" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(295.47999999999996, 181.44) rotate(0)">Campaign C</text></g><g class="data-point"><circle cx="239.8" cy="371.48" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="0px"></circle><text x="0" y="0" fill="#4c1d95" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(239.8, 376.48) rotate(0)">Campaign B</text></g><g class="data-point"><circle cx="170.2" cy="214.60000000000002" r="5" fill="#7c3aed" stroke="#7c3aed" stroke-width="0px"></circle><text x="0" y="0" fill="#4c1d95" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(170.2, 219.60000000000002) rotate(0)">Campaign A</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#b45309" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low Reach</text></g><g class="label"><text x="0" y="0" fill="#b45309" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High Reach</text></g><g class="label"><text x="0" y="0" fill="#0e7490" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Low Engagement</text></g><g class="label"><text x="0" y="0" fill="#0e7490" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">High Engagement</text></g></g><g class="title"><text x="0" y="0" fill="#be185d" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Reach and engagement</text></g></g></svg>
<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" height="784" style="display: block; margin: 0px auto; width: 784px; height: 784px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#a44141;}#kanvibeDiagram .error-text{fill:#ddd;stroke:#ddd;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:lightgrey;stroke:lightgrey;}#kanvibeDiagram .marker.cross{stroke:lightgrey;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .node .neo-node{stroke:#ccc;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node path{stroke:url(#kanvibeDiagram-gradient);stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="20" width="217" height="217" fill="#1f2020"></rect><text x="0" y="0" fill="#e0dfdf" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(371.5, 128.5) rotate(0)">Premium</text></g><g class="quadrant"><rect x="46" y="20" width="217" height="217" fill="#242525"></rect><text x="0" y="0" fill="#dbdada" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(154.5, 128.5) rotate(0)">Luxury</text></g><g class="quadrant"><rect x="46" y="237" width="217" height="217" fill="#292a2a"></rect><text x="0" y="0" fill="#d6d5d5" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(154.5, 345.5) rotate(0)">Budget</text></g><g class="quadrant"><rect x="263" y="237" width="217" height="217" fill="#2e2f2f"></rect><text x="0" y="0" fill="#d1d0d0" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(371.5, 345.5) rotate(0)">Value</text></g></g><g class="border"><line x1="45" y1="20" x2="481" y2="20" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="480" y1="21" x2="480" y2="453" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="45" y1="454" x2="481" y2="454" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="46" y1="21" x2="46" y2="453" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="263" y1="21" x2="263" y2="453" style="stroke: rgb(204, 204, 204); stroke-width: 1;"></line><line x1="47" y1="237" x2="479" y2="237" style="stroke: rgb(204, 204, 204); stroke-width: 1;"></line></g><g class="data-points"></g><g class="labels"><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(154.5, 479) rotate(0)">Slow</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(371.5, 479) rotate(0)">Fast</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 345.5) rotate(-90)">Cheap</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 128.5) rotate(-90)">Expensive</text></g></g><g class="title"></g></g></svg>
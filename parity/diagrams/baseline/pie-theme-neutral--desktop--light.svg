<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588.546875 450" role="graphics-document document" aria-roledescription="pie" height="599" style="display: block; margin: 0px auto; width: 784px; height: 599px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#552222;}#kanvibeDiagram .error-text{fill:#552222;stroke:#552222;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:#666;stroke:#666;}#kanvibeDiagram .marker.cross{stroke:#666;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#kanvibeDiagram .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#kanvibeDiagram .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#kanvibeDiagram .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#000000;font-size:17px;}#kanvibeDiagram .legend text{fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#kanvibeDiagram .node .neo-node{stroke:#999;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node path{stroke:url(#kanvibeDiagram-gradient);stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#kanvibeDiagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-113.629,-145.991L0,0Z" fill="#F4F4F4" class="pieCircle"></path><path d="M-113.629,-145.991A185,185,0,0,1,-60.069,-174.976L0,0Z" fill="#555" class="pieCircle"></path><path d="M-60.069,-174.976A185,185,0,0,1,-20.352,-183.877L0,0Z" fill="#BBB" class="pieCircle"></path><path d="M-20.352,-183.877A185,185,0,0,1,0,-185L0,0Z" fill="#777" class="pieCircle"></path><text transform="translate(45.052051352149846,131.23214228596305)" class="slice" style="text-anchor: middle;">89%</text><text transform="translate(-66.03770078389392,-122.02698297990037)" class="slice" style="text-anchor: middle;">5%</text><text transform="translate(-30.342001404884673,-135.3917480895567)" class="slice" style="text-anchor: middle;">4%</text><text transform="translate(-7.643426749376295,-138.53931040512265)" class="slice" style="text-anchor: middle;">2%</text><text x="0" y="-200" class="pieTitleText">Diagram types in transcripts</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(244, 244, 244); stroke: rgb(244, 244, 244);"></rect><text x="22" y="14">flowchart</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(85, 85, 85); stroke: rgb(85, 85, 85);"></rect><text x="22" y="14">sequence</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(187, 187, 187); stroke: rgb(187, 187, 187);"></rect><text x="22" y="14">pie</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(119, 119, 119); stroke: rgb(119, 119, 119);"></rect><text x="22" y="14">state</text></g></g></svg>
e-width: 1;"></line><line x1="6" y1="209" x2="568" y2="209" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="456.20000000000005" cy="273" r="4" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(456.20000000000005, 278) rotate(0)">Beta &amp; Co</text></g><g class="data-point"><circle cx="117.80000000000001" cy="145" r="8" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(117.80000000000001, 150) rotate(0)">Alpha</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(146, 379) rotate(0)">Low&lt;br&gt;cost</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(428, 379) rotate(0)">High cost</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(579, 289) rotate(-90)">Low value</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(579, 129) rotate(-90)">High value</text></g></g><g class="title"><text x="0" y="0" fill="#131300" font-size="24" dominant-baseline="hanging" text-anchor="middle" transform="translate(300, 10) rotate(0)">"R&amp;amp;D &lt;br&gt; portfolio"</text></g></g></svg>
<svg id="kanvibeDiagram" width="784" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart" height="784" style="display: block; margin: 0px auto; width: 784px; height: 784px; max-width: none;"><style>#kanvibeDiagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kanvibeDiagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kanvibeDiagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kanvibeDiagram .error-icon{fill:#552222;}#kanvibeDiagram .error-text{fill:#552222;stroke:#552222;}#kanvibeDiagram .edge-thickness-normal{stroke-width:1px;}#kanvibeDiagram .edge-thickness-thick{stroke-width:3.5px;}#kanvibeDiagram .edge-pattern-solid{stroke-dasharray:0;}#kanvibeDiagram .edge-thickness-invisible{stroke-width:0;fill:none;}#kanvibeDiagram .edge-pattern-dashed{stroke-dasharray:3;}#kanvibeDiagram .edge-pattern-dotted{stroke-dasharray:2;}#kanvibeDiagram .marker{fill:#333333;stroke:#333333;}#kanvibeDiagram .marker.cross{stroke:#333333;}#kanvibeDiagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kanvibeDiagram p{margin:0;}#kanvibeDiagram .node .neo-node{stroke:#9370DB;}#kanvibeDiagram [data-look="neo"].node rect,#kanvibeDiagram [data-look="neo"].cluster rect,#kanvibeDiagram [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#kanvibeDiagram [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#kanvibeDiagram [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].node circle .state-start{fill:#000000;}#kanvibeDiagram [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#kanvibeDiagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="71" width="232" height="212" fill="#ECECFF"></rect><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(379, 177) rotate(0)">Expand</text></g><g class="quadrant"><rect x="31" y="71" width="232" height="212" fill="#f1f1ff"></rect><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(147, 177) rotate(0)">Promote</text></g><g class="quadrant"><rect x="31" y="283" width="232" height="212" fill="#f6f6ff"></rect><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(147, 389) rotate(0)">Re-evaluate</text></g><g class="quadrant"><rect x="263" y="283" width="232" height="212" fill="#fbfbff"></rect><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(379, 389) rotate(0)">Improve</text></g></g><g class="border"><line x1="30" y1="71" x2="496" y2="71" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="495" y1="72" x2="495" y2="494" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="30" y1="495" x2="496" y2="495" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="31" y1="72" x2="31" y2="494" style="stroke: rgb(199, 199, 241); stroke-width: 2;"></line><line x1="263" y1="72" x2="263" y2="494" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line><line x1="32" y1="283" x2="494" y2="283" style="stroke: rgb(199, 199, 241); stroke-width: 1;"></line></g><g class="data-points"></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 45) rotate(0)">Low</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 45) rotate(0)">High</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 389) rotate(-90)">Low</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 177) rotate(-90)">High</text></g></g><g class="title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Only quadrants</text></g></g></svg>
# 스크린샷 기준 상태 목록. 앱 종류(Electron/GPUI)와 상관없이 같은 상태를 재현하기 위한 선언이다.
#
# 각 상태: id(인벤토리 02-screens.md의 SCR-*), themes(dark만 또는 dark+light), window(창 크기), route(#/ 뒤 경로),
# fixture(데이터셋 이름, parity/fixtures/build_fixture.py), settings(app_settings 덮어쓰기),
# fixture_extras(격리 HOME에 더할 묶음, make_home.EXTRAS), network(parity/fixtures/network/<이름>.json),
# faults(첫 화면을 열기 전에 거는 서비스 고장), steps(화면을 연 뒤 실행할 단계).
# 이미지 파일 이름: 다크 <id>.png, 라이트 <id>--light.png.
#
# 단계 어휘(드라이버가 구현한다)
#   wait: <ms>                              고정 대기
#   wait_for: <대상>                         대상이 보일 때까지 대기
#   click | double_click | right_click | hover | focus: <대상>
#   fill: {<대상>, value}                    입력란 값을 바꾼다
#   type: <문자열>                           포커스된 곳에 키보드로 입력
#   press: <키 또는 목록>                     예: "Mod+Shift+P". Mod = macOS Cmd, 그 밖 Ctrl
#   mouse_move: {x, y} / mouse_down / mouse_up
#   drag_hold: {from: <대상>, to: <대상>}     집어 들고 목표 위에서 멈춘다(놓지 않음)
#   scroll: {<대상>, delta_y: <px|bottom>}   스크롤 컨테이너를 움직인다
#   scroll_into_view: <대상>                 대상이 보일 때까지 가장 가까운 스크롤 영역을 움직인다
#   fault: {target, mode, ...}              서비스 호출 고장 주입(아래)
#   clear_fault: <target>
#   board_event: <payload>                  앱 내부 보드 이벤트(백엔드 → 화면) 발생
#   main_send: {channel, payload}           백엔드 → 화면 알림(TS 채널 이름은 식별자로만 쓴다)
#   navigate: <route>                       같은 문서 안에서 경로 이동
#   eval: {script, description}             위 어휘로 표현할 수 없는 조작(설명 필수)
#
# 대상(<대상>) 표기. 가능한 한 보이는 글자·역할로 적는다.
#   "글자"                       정확히 그 글자를 가진 첫 요소
#   {text, exact}                글자
#   {role, name, exact}          접근성 역할 + 이름(aria-label 포함)
#   {label} / {placeholder} / {title}
#   {selector, description}      글자·역할로 집을 수 없을 때만. description에 무엇인지 적는다
#   nth: <n|last>, within: <대상>
#
# 서비스 고장(fault) 대상은 "<영역>.<동작>" 이름이다. TS 앱에서는 IPC namespace.method와 같다.
#   mode: hang(영원히 응답 없음) | fail(오류, message) | delay(ms 뒤 정상 처리) | result(정상 처리 대신 value/value_ref 반환)
#   match: 인자에 이 글자가 들어 있는 호출만, after_calls: n번째 호출 이후부터, ms: fail 전 대기
#   "<영역>.*"은 그 영역의 모든 동작이다.

defaults:
  window: {width: 1600, height: 1000}
  fixture: full
  network: default
  settle_ms: 1500
  platform: linux

states:
  # ───────────── 부트 ─────────────
  - id: SCR-BOOT-01
    title: index.html 정적 스켈레톤(스크립트 실행 전 첫 프레임)
    route: /ko
    disable_javascript: true
  - id: SCR-BOOT-02
    title: lazy 라우트 Suspense fallback "Loading..."
    themes: [dark, light]
    route: /ko/settings
    hold_requests: ["/SettingsRoute-[^/]*\\.js$"]
    notes: 설정 라우트 번들을 끝내지 않고 붙잡아 Suspense fallback을 남긴다. GPUI에는 같은 의미의 라우트 로딩 표시를 그린다.

  # ───────────── 보드(칸반) ─────────────
  - id: SCR-BOARD-01
    title: 로딩 스켈레톤
    themes: [dark, light]
    route: /ko
    faults: [{target: kanban.getTasksByStatus, mode: hang}]
  - id: SCR-BOARD-02
    title: 스켈레톤 + loadDelayed 안내
    route: /ko
    faults: [{target: kanban.getTasksByStatus, mode: hang}]
    steps:
      - wait_for: {text: "조회가 지연되고 있습니다. 계속 기다리는 중…", timeout: 10000}
  - id: SCR-BOARD-03
    title: 최초 로드 실패
    route: /ko
    faults: [{target: kanban.getTasksByStatus, mode: fail, message: "database is locked"}]
    steps:
      - wait_for: {role: button, name: 다시 시도}
  - id: SCR-BOARD-04
    title: 채워진 보드
    themes: [dark, light]
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
  - id: SCR-BOARD-05
    title: 빈 보드
    themes: [dark, light]
    route: /ko
    fixture: empty
    steps:
      - wait: 1000
  - id: SCR-BOARD-06
    title: 데이터 있음 + 재조회 실패 배너
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - fault: {target: kanban.getTasksByStatus, mode: fail, message: "database is locked"}
      - board_event: {type: board-updated}
      - wait_for: {text: "최신 데이터를 불러오지 못해 이전 데이터를 표시합니다", exact: false}
  - id: SCR-BOARD-07
    title: 카드 키보드 포커스 링
    themes: [dark, light]
    route: /ko
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - mouse_move: {x: 1599, y: 999}
      - focus: {selector: "[data-kanban-task-card='true'][data-kanban-status='todo']", description: Todo 열의 첫 카드}
      - press: ArrowRight
  - id: SCR-BOARD-08
    title: 카드 요청 상태(삭제 중·삭제 실패·이동 저장 중·이동 실패)
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - fault: {target: kanban.deleteTask, mode: hang, match: "22222222-2222-4222-8222-000000000001"}
      - fault: {target: kanban.deleteTask, mode: fail, match: "22222222-2222-4222-8222-000000000002", message: "worktree is dirty"}
      - fault: {target: kanban.moveTaskToColumn, mode: hang, match: "22222222-2222-4222-8222-000000000020"}
      - fault: {target: kanban.moveTaskToColumn, mode: fail, match: "22222222-2222-4222-8222-000000000030", message: "database is locked"}
      - right_click: 보드 필터 저장 위치 정하기
      - click: {role: menuitem, name: 삭제, exact: true}
      - right_click: 온보딩 문서 초안
      - click: {role: menuitem, name: 삭제, exact: true}
      - right_click: 다크 모드 지원
      - click: {role: menuitem, name: 상태 변경하기, exact: false}
      - click: {role: menuitemradio, name: Progress}
      - right_click: 로그인 후 리다이렉트 수정
      - click: {role: menuitem, name: 상태 변경하기, exact: false}
      - click: {role: menuitemradio, name: Progress}
      - wait: 1000
  - id: SCR-BOARD-09
    title: Done 열 더 보기 버튼
    route: /ko
    fixture: many-done
    steps:
      - wait_for: 보드 필터 추가
      - scroll_into_view: {role: button, name: 더 보기}
      - wait: 500
  - id: SCR-BOARD-10
    title: 카드 드래그 중
    route: /ko
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - drag_hold: {from: {text: 온보딩 문서 초안}, to: {text: 푸시 알림 설정 화면, offset_y: 80}}
      - wait: 500
  - id: SCR-BOARD-11
    title: 카드 컨텍스트 메뉴
    themes: [dark, light]
    route: /ko
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - right_click: 보드 필터 추가
      - wait_for: {role: menu}
  - id: SCR-BOARD-12
    title: 새 작업 모달(빈 폼)
    themes: [dark, light]
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - click: + 새 작업
      - wait_for: 새 작업 생성
  - id: SCR-BOARD-13
    title: 새 작업 모달 입력 상태(프로젝트 선택 + 브랜치 검색 드롭다운)
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - click: + 새 작업
      - click: 프로젝트 선택
      - type: kanvibe-demo
      - press: Enter
      - wait: 800
      - click: {placeholder: 브랜치명을 입력하여 검색...}
      - type: feat
      - wait: 800
  - id: SCR-BOARD-14
    title: 브랜치 분기 모달
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - right_click: 보드 필터 저장 위치 정하기
      - click: {role: menuitem, name: 브랜치 분기}
      - wait_for: {role: heading, name: 브랜치 분기}
      - wait: 800
  - id: SCR-BOARD-15
    title: 프로젝트 등록 다이얼로그
    themes: [dark, light]
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - click: {role: button, name: 프로젝트 스캔, exact: false}
      - wait_for: {role: dialog}
      - wait: 800
  - id: SCR-BOARD-16
    title: Done 이동 확인 다이얼로그
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - right_click: 보드 필터 추가
      - click: {role: menuitem, name: 상태 변경하기, exact: false}
      - click: {role: menuitemradio, name: Done}
      - wait_for: Done 이동 경고
  - id: SCR-BOARD-17
    title: 프로젝트 필터 드롭다운
    route: /ko
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - click: 전체 프로젝트
      - wait: 500
  - id: SCR-BOARD-18
    title: 데스크톱 필터 팝오버
    route: /ko
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - click: {role: button, name: 데스크톱 필터}
      - wait_for: {role: dialog, name: 데스크톱 필터}
  - id: SCR-BOARD-19
    title: 정렬 팝오버
    route: /ko
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - click: {role: button, name: 정렬}
      - wait: 500
  - id: SCR-BOARD-20
    title: 알림 센터 패널
    themes: [dark, light]
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - press: Mod+Shift+I
      - wait: 800
  - id: SCR-BOARD-21
    title: 보드 찾기 바(일치)
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - press: Mod+F
      - type: 필터
      - wait: 500
  - id: SCR-BOARD-22
    title: 태스크 종류 필터(Project)
    route: /ko
    steps:
      - wait_for: 보드 필터 추가
      - click: {role: button, name: Project, exact: true}
      - wait: 500
  - id: SCR-BOARD-23
    title: macOS 타이틀바 레이아웃(렌더러의 플랫폼 판정만 macOS로 둔다)
    route: /ko
    platform: mac
    steps:
      - wait_for: 보드 필터 추가
    notes: 창 테두리(Linux titleBarOverlay)는 그대로다. 렌더러가 macOS로 판정했을 때의 레이아웃만 고정한다.
  - id: SCR-BOARD-24
    title: 좁은 폭(xl 미만)
    route: /ko
    window: {width: 1200, height: 1000}
    steps:
      - wait_for: 보드 필터 추가

  # ───────────── 보드(워크스페이스) ─────────────
  - id: SCR-WS-01
    title: 워크스페이스 로딩(지연 안내)
    route: /ko
    settings: {board_view_mode: workspace}
    faults: [{target: kanban.getTasksByStatus, mode: hang}]
    steps:
      - wait: 6000
  - id: SCR-WS-02
    title: 워크스페이스 로드 실패
    route: /ko
    settings: {board_view_mode: workspace}
    faults: [{target: kanban.getTasksByStatus, mode: fail, message: "database is locked"}]
    steps:
      - wait_for: {role: button, name: 다시 시도}
  - id: SCR-WS-03
    title: 태스크 목록 + 선택 태스크 터미널
    themes: [dark, light]
    route: /ko
    settings: {board_view_mode: workspace}
    steps:
      - wait_for: 보드 필터 추가
      - wait: 2500
  - id: SCR-WS-04
    title: 선택 없음(세션 있는 태스크 없음)
    route: /ko
    fixture: no-sessions
    settings: {board_view_mode: workspace}
    steps:
      - wait_for: 보드 필터 추가
  - id: SCR-WS-05
    title: 세션 없는 태스크 선택 → 자동 연결 중
    route: /ko
    fixture: no-sessions
    settings: {board_view_mode: workspace}
    faults: [{target: kanban.connectTerminalSession, mode: hang}]
    steps:
      - wait_for: 보드 필터 추가
      - click: 보드 필터 추가
      - wait: 1500
  - id: SCR-WS-06
    title: 목록 검색 불일치
    route: /ko
    settings: {board_view_mode: workspace}
    steps:
      - wait_for: 보드 필터 추가
      - click: {placeholder: "제목, 브랜치, 프로젝트 검색"}
      - type: zzzz
      - wait: 2000
  - id: SCR-WS-07
    title: 목록 상단 정렬 팝오버
    route: /ko
    settings: {board_view_mode: workspace}
    keep_mouse: true
    steps:
      - wait_for: 보드 필터 추가
      - click: {role: button, name: 정렬}
      - wait: 2000
  - id: SCR-WS-08
    title: 목록 Done 더 보기
    route: /ko
    fixture: many-done
    settings: {board_view_mode: workspace}
    steps:
      - wait_for: 보드 필터 추가
      - scroll_into_view: {role: button, name: 더 보기}
      - wait: 1500

  # ───────────── 태스크 상세 ─────────────
  - id: SCR-TASK-01
    title: 로딩 + 지연 안내
    route: /ko/task/22222222-2222-4222-8222-000000000010
    faults: [{target: kanban.getTaskById, mode: hang}]
    steps:
      - wait: 6000
  - id: SCR-TASK-02
    title: 로드 실패
    route: /ko/task/22222222-2222-4222-8222-000000000010
    faults: [{target: kanban.getTaskById, mode: fail, message: "database is locked"}]
    steps:
      - wait_for: {role: button, name: 다시 시도}
  - id: SCR-TASK-03
    title: 태스크 없음
    route: /ko/task/99999999-9999-4999-8999-999999999999
    steps:
      - wait: 1500
  - id: SCR-TASK-04
    title: 터미널 뷰(패널 닫힘)
    themes: [dark, light]
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - wait: 1000
  - id: SCR-TASK-05
    title: Overview 패널 열림(기본)
    themes: [dark, light]
    route: /ko/task/22222222-2222-4222-8222-000000000010
    steps:
      - wait_for: 작업 정보
      - wait: 2000
  - id: SCR-TASK-06
    title: 설명 인라인 편집
    route: /ko/task/22222222-2222-4222-8222-000000000010
    steps:
      - wait_for: 작업 정보
      - click: {text: "프로젝트·상태별 필터를 보드 헤더에 추가하고 선택을 기억한다.", exact: true}
      - wait: 800
  - id: SCR-TASK-07
    title: Status 패널
    themes: [dark, light]
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - press: Mod+2
      - wait: 2500
  - id: SCR-TASK-08
    title: Hooks 상태 변형(원격 태스크)
    route: /ko/task/22222222-2222-4222-8222-000000000031
    settings: {sidebar_default_collapsed: "true"}
    steps:
      - wait: 2000
      - press: Mod+2
      - wait: 3000
  - id: SCR-TASK-09
    title: 실행중 세션 패널(실행 중 세션 있음)
    themes: [dark, light]
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    fixture_extras: [live-sessions]
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - press: Mod+5
      - wait: 2500
  - id: SCR-TASK-10
    title: 에이전트 호출 그래프
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    fixture_extras: [live-sessions]
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - press: Mod+5
      - click: {role: button, name: 그래프, exact: false}
      - wait: 2500
  - id: SCR-TASK-11
    title: AI 사용량 패널(값)
    themes: [dark, light]
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    fixture_extras: [ai-accounts]
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - press: Mod+0
      - wait: 3000
  - id: SCR-TASK-12
    title: AI 대화 기록 메인 뷰
    themes: [dark, light]
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    fixture_extras: [chat-history]
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - press: Mod+3
      - wait: 2000
      - click: {text: "보드 헤더에 프로젝트·상태 필터를 추가하고 선택을 기억해 줘.", exact: false}
      - wait: 3000
  - id: SCR-TASK-13
    title: 대화 기록 빈 상태
    route: /ko/task/22222222-2222-4222-8222-000000000010
    settings: {sidebar_default_collapsed: "true"}
    steps:
      - wait_for: {text: "feat-board-filters $", exact: false}
      - press: Mod+3
      - wait: 2500
